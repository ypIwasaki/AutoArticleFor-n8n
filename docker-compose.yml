# Legacy n8n-only runtime. The current DB service is WSL-loopback-only;
# use docs/pc-migration.md for the supported full application setup.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.8.4
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Tokyo}
      TZ: ${TZ:-Asia/Tokyo}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED:-true}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-before-production}
      # Container paths match the bind mount, independent of host paths in .env.
      PROJECT_ROOT: /project
      N8N_RESTRICT_FILE_ACCESS_TO: /project
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/project
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:

